name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      # Artifact tests invoke `python -m build --no-isolation`, so the PEP 517
      # backend must remain installed in the runner environment.
      - run: python -m pip install -e '.[dev]' 'hatchling>=1.26,<2'
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy src
      - run: python -m pytest -q

  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deployment-shape:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp deploy/ec2/compose.env.example .env
      - run: cp deploy/ec2/api.env.example deploy/ec2/api.env
      - run: cp deploy/ec2/worker.env.example deploy/ec2/worker.env
      - run: cp deploy/ec2/migration.env.example deploy/ec2/migration.env
      - run: docker compose -f docker-compose.ec2.yml config --quiet
