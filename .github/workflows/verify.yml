name: verify

on:
  pull_request:
  push:
    branches: [main, codex/audit-fixes]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.10"
      - name: Guard frozen schema manifest
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/check_schema_manifest_change.py "$DIFF_BASE"
      # Building may use package registries. Every verification command below
      # executes in a container with external networking disabled.
      - run: docker build --target test -t hmt-crypto-test:${{ github.sha }} .
      - run: docker run --rm --network none hmt-crypto-test:${{ github.sha }} python -m ruff format --check .
      - run: docker run --rm --network none hmt-crypto-test:${{ github.sha }} python -m ruff check .
      - run: docker run --rm --network none hmt-crypto-test:${{ github.sha }} python -m mypy src
      - run: docker run --rm --network none hmt-crypto-test:${{ github.sha }} python -m pytest -q

  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.21.1"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  postgres-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Image construction may reach package registries. Acceptance execution
      # uses an internal-only Docker network shared solely with disposable PG.
      - run: docker build --target test -t hmt-crypto-test:${{ github.sha }} .
      - run: docker network create --internal hmt-acceptance
      - name: Create disposable PostgreSQL TLS identity
        run: |
          mkdir -p /tmp/hmt-acceptance-tls
          openssl req -new -x509 -days 1 -nodes \
            -out /tmp/hmt-acceptance-tls/server.crt \
            -keyout /tmp/hmt-acceptance-tls/server.key \
            -subj /CN=hmt-acceptance-postgres \
            -addext subjectAltName=DNS:hmt-acceptance-postgres
          chmod 600 /tmp/hmt-acceptance-tls/server.key
          sudo chown -R 999:999 /tmp/hmt-acceptance-tls
      - name: Start disposable PostgreSQL
        run: >-
          docker run -d --rm --name hmt-acceptance-postgres
          --network hmt-acceptance
          -v /tmp/hmt-acceptance-tls:/tls:ro
          -e POSTGRES_PASSWORD=acceptance-only
          -e POSTGRES_DB=hmt_acceptance
          postgres:16-bookworm
          -c ssl=on
          -c ssl_cert_file=/tls/server.crt
          -c ssl_key_file=/tls/server.key
      - name: Wait for disposable PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if docker exec hmt-acceptance-postgres pg_isready -U postgres; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Create isolated migration database
        run: docker exec hmt-acceptance-postgres createdb -U postgres hmt_migration
      - name: Run 14 repository and decimal acceptance cases offline
        run: |
          docker run --rm --network hmt-acceptance \
            -e HMT_CRYPTO_DECIMAL_POSTGRES_URL=postgresql+asyncpg://postgres:acceptance-only@hmt-acceptance-postgres:5432/hmt_acceptance \
            -e HMT_CRYPTO_DECIMAL_POSTGRES_DISPOSABLE=true \
            -e HMT_CRYPTO_REQUIRE_DECIMAL_POSTGRES=true \
            -e HMT_CRYPTO_REPOSITORY_POSTGRES_URL=postgresql+asyncpg://postgres:acceptance-only@hmt-acceptance-postgres:5432/hmt_acceptance \
            -e HMT_CRYPTO_REPOSITORY_POSTGRES_DISPOSABLE=true \
            -e HMT_CRYPTO_REQUIRE_REPOSITORY_POSTGRES=true \
            hmt-crypto-test:${{ github.sha }} \
            python -m pytest -q \
              tests/integration/test_exact_decimal_postgresql_acceptance.py::test_raw_postgres_decimal_boundary_and_catalogue_contract \
              tests/integration/test_repository_postgresql_acceptance.py -k 'test_postgres_'
      - name: Run the 15th migration-chain acceptance case offline
        run: |
          docker run --rm --network hmt-acceptance \
            -v /tmp/hmt-acceptance-tls/server.crt:/tmp/hmt-acceptance-postgres.crt:ro \
            -e DATABASE_MIGRATION_CA_FILE=/tmp/hmt-acceptance-postgres.crt \
            -e HMT_CRYPTO_MIGRATION_ACCEPTANCE_URL=postgresql+asyncpg://postgres:acceptance-only@hmt-acceptance-postgres:5432/hmt_migration \
            -e HMT_CRYPTO_MIGRATION_ACCEPTANCE_DISPOSABLE=true \
            -e HMT_CRYPTO_REQUIRE_MIGRATION_POSTGRES=true \
            -e HMT_CRYPTO_ALLOW_EMPTY_DOWNGRADE=I_ACKNOWLEDGE_EMPTY_DEV_DATABASE \
            hmt-crypto-test:${{ github.sha }} \
            python -m pytest -q \
              tests/integration/test_migration_postgresql_acceptance.py::test_migration_security_and_downgrade_contracts_on_disposable_postgres

  deployment-shape:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp deploy/ec2/compose.env.example .env
      - run: cp deploy/ec2/api.env.example deploy/ec2/api.env
      - run: cp deploy/ec2/worker.env.example deploy/ec2/worker.env
      - run: cp deploy/ec2/migration.env.example deploy/ec2/migration.env
      - run: docker compose -f docker-compose.ec2.yml config --quiet
