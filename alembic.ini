[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/src
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 48
version_path_separator = os
path_separator = os

# Deliberately absent: sqlalchemy.url. env.py accepts only the exact
# DATABASE_MIGRATION_URL process environment variable.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
